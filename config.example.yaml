# issue-keeper 配置文件
# 把 AgentProc profile 绑定到仓库；程序监控这些仓库的 issue（可选 PR），
# 发现有新 issue/PR 或新评论时，先过一道安全过滤（screener），
# 再通过 agentproc CLI 调用对应 profile 的 agent 处理，并把 agent 的回复作为评论发回。

# daemon 模式的轮询间隔（秒）。--once 模式忽略此值。
poll_interval_secs: 300

# 状态文件路径：记录每个仓库已处理的 issue/PR / 评论 / agent 会话。
state_file: ~/.issue-keeper/state.json

# agent 发出的评论里携带的隐藏标记。三层防循环之第一层（机器识别）。
bot_marker: "<!-- issue-keeper-bot -->"

# 调用 agent 时的整体超时（秒）。
default_timeout_secs: 600

# 调用 agent 时写入 AGENT_FROM_USER 的值；也作为 agent_label 的 fallback。
agent_from_user: "issue-keeper"

# 默认 review agent：人提的 issue 处理完后，由这个 agent 先 review。
# 为空则人提的 issue 处理完停在 review 状态等人接手。
# 每个 repo 也可单独配 review_agent 覆盖此全局默认。
default_review_agent: "reviewer-agent"

# 单一人类模型：keeper 代谁 review / HitL 永远推给这一个人（ilink 通道只推给一个激活用户）。
human_label: "human"

# ─── keeper 巡检（代人类 review / 主动分诊）──────────────────────────────
# keeper（role=keeper 的绑定，如 issue-keeper-agent）定期巡检「等人处理」的 issue：
#   - 人提的 issue 停在 review（agent 已回复等人接手）→ keeper 代为 review。
#   - 人提的 issue 停在 inbox 超过 stale_inbox_secs → keeper 代为分诊。0 = 只看 review。
# 每 interval_cycles 轮跑一次（防每轮打扰人类）；每条 issue 无新活动不重复巡检/HitL。
# 需要 keeper 绑定 role=keeper + 接好 hitl MCP（见 README「keeper 的 HitL 接入」）。
keeper_patrol:
  enabled: true
  interval_cycles: 4        # 4 × poll_interval ≈ 20min
  stale_inbox_secs: 7200    # inbox 停留超过 2h 纳入巡检；0 = 只看 review
  max_per_cycle: 5          # 每轮最多巡检多少条候选 issue

# keeper agent 的调用超时（秒）。keeper 可能用 HitL 等人类回复（hitl --timeout 3600 = 1h），
# 所以默认 65min，比普通 agent 的 default_timeout_secs 大。仅对 role=keeper 的绑定生效。
keeper_timeout_secs: 3900

# ─── 回评礼仪化（reply_polish）────────────────────────────────────────
# agent 的原始回复不适合直接公开：常带工作过程叙述（「我先…然后…」）、内部状态、
# 本机绝对路径甚至重复段落。发布前做两层处理（issue_keeper/reply.py）：
#   1. 确定性消毒：本机绝对路径 / 密钥赋值 → [REDACTED-*]（永远执行，含礼仪化关闭时）
#   2. LLM 改写：一次廉价调用把原文改写成 issue 礼仪的评论（结论先行、只留结果
#      与事实、去重）。任何失败都降级为消毒后的原文——绝不阻塞或吞掉回评。
# 连接字段（provider/api_key/base_url/model）缺省继承 screener 的凭据，零配置可用；
# 下方注释值即为默认。
reply_polish:
  enabled: true
  # provider: openai          # openai | anthropic
  # api_key: ${DEEPSEEK_API_KEY}
  # base_url: "https://api.deepseek.com/v1"
  # model: deepseek-chat
  # max_chars: 16000          # 喂给改写调用的最大字符数
  # timeout_secs: 60
  # min_chars: 120            # 短于此的原文跳过改写（只消毒）

# ─── 触发门槛（防注入骚扰/资源滥用）──────────────────────────────────
# 显式豁免标签：带任一标签的 issue/PR 被 keeper 完全跳过——首响、评论、screener
# 一律不碰（比 allowlist 更早生效）。用途：人工协调线程/公告等不想被 automation
# 消费的 issue；摘掉标签后下一轮恢复处理。
opt_out_labels: ["keeper-ignore"]
# 作者 allowlist：非空时仅名单内作者的新 issue 触发 agent（大小写不敏感）。
# agent 自提 issue 的作者默认不在名单 → 静默跳过（S7 防滥用）。
author_allowlist: ["okguitar", "kongjie", "jeffkit"]
# 同作者每日触发次数上限（按 pipeline 台账计数；push_mode=main 的爆炸半径闸）。
# 跳过会把该 issue 永久标记 processed（后续只看评论）——批量提 issue 前先调它。
author_daily_limit: 3
# 豁免日限的作者名单（大小写不敏感）：名单内作者触发次数不限。
author_daily_limit_exempt: [okguitar]
# 同一 issue 每日最多管线 run 次数（按 pipeline 台账计数）。防终态（guarded/
# engine_error 等）被反复重派：单轮 run 半小时起步，0 = 不限。到顶只推迟
# 不消费——次日自动重试，人工处置后也可 `reopen` 立即重派。
pipeline_issue_daily_limit: 2
# 派发优先级仓：名单内的仓在每轮扫描序里排最前——槽位释放时先被派发，
# 治理「排末位的仓被前序仓的失败-重试循环长期饿死」（2026-10-05：recursive
# 批次被饿 8h 实证）。空/不写 = 纯扫描序（默认行为不变）。
# pipeline_priority_repos: [owner/repo]
# 失败类（status=failed）自动重派额度（#8）：首败自动重试一轮（台账 +1 run 记录，
# 退避一个 poll 周期），耗尽后近 12h 连续 ≥2 次失败才升级人工（评论 + 标签）。
# 0 = 不自动重试。失败类 run 不计入上面两道日限（配额与 reopen 解耦）。
failed_auto_retry: 1
# 升级人工时打的标签（#8）：需先在仓库内存在（本工具不自动创建标签）；
# 不要写进 opt_out_labels，否则该 issue 会被 keeper 整体跳过。
pipeline_needs_human_label: needs-human

# ─── issue-pipeline 混合形态（pipeline）────────────────────────────────
# 定义与观测归 plaita-console，执行留本地 bridge（flows/pipeline_bridge.py，
# killpg 孤儿清理语义不外迁——console cancel 不杀进程树，2026-09-28 真机验证）。
# 整段缺省 = 纯本地模式：bridge 直接用仓内 flows/issue-pipeline.flow.json、不上报。
pipeline:
  console:
    # 定义源：bridge 按 TTL 拉取 console 上 semver 最高的已发布 issue-pipeline 定义；
    # console 不可达退 stale 缓存，缓存也没有退仓内本地文件（三级 fail-open）。
    url: ${PLAITA_CONSOLE_URL}
    api_key: ${PLAITA_CONSOLE_ADMIN_API_KEY}
    flow_id: issue-pipeline
    refresh_secs: 300
    cache_path: ~/.issue-keeper/pipeline/flow-cache.json
  # 执行观测上报：指向 console 所用 Redis（非空才上报）。bridge 把每次 run 写进
  # plaita:execution:{id}（30 天过期）+ 逐节点 publish SSE 频道，console 执行页
  # 可见节点级 trace；Langfuse 另需进程 env LANGFUSE_PUBLIC_KEY（trace id = 执行 id）。
  # observability_redis: redis://localhost:6379/0

# ─── 管线 run 预算墙（与 recursive v3 宿主对齐）────────────────────────
# pipeline_timeout_secs：bridge 子进程整跑超时（秒），到点 reaper 对整个进程组
# killpg（agent 子树一并清）——keeper 侧的最终护栏。
# 对 engine=v2 的仓，keeper 派发时会把 run 级预算墙注入宿主 env：
#   RECURSIVE_RUN_DEADLINE = 派发时刻 + pipeline_timeout_secs - run_deadline_margin_secs
# recursive v3 宿主（RECURSIVE_HOST_V3=1）到点先优雅退出：checkpoint/verdict
# 落盘、台账带 node_retry_exhausted（reaper 不再自动重派白烧一轮）；killpg 只
# 兜底。margin 即留给宿主收尾的窗口（0 = 不留窗口，护栏退回纯 killpg）。
# per-repo engine_env 里显式配了 RECURSIVE_RUN_DEADLINE 则以显式值为准。
pipeline_timeout_secs: 5400
run_deadline_margin_secs: 300

# ─── per-repo 管线契约（pipeline_repos，v0.3 2026-09-30）──────────────
# 每个仓自带：基线分支 / 依赖安装 / 质量门（单命令或多门清单）/ 交付策略 /
# 审核模式 / 仓规注入（红线·路由·文档惯例）/ 段预算覆盖。
# 资格规则：未登记且无门的仓**不进管线**（回退 legacy 单 agent 路径）——
# 空门跑 `true` 恒过的假绿已废止；readonly 仓不需要门。
# 全局 pipeline_push_mode / pipeline_review_mode 只作缺省，per-repo 可覆盖。
pipeline_repos:
  # Rust 仓 + 多门（含条件门：触及 recursive-tui 才跑 mutants，预算对齐其
  # AGENTS.md 失败模式 #8 的 40-60min 实测）。门清单也可放仓内
  # .issue-keeper/gates.json（惯例归仓，gate_runner 会自动发现）。
  jeffkit/recursive:
    base_branch: main
    push_mode: main                # jeffkit 拍板：recursive 可直推
    review_notes: "Anthropic input_schema 顶层不得出现 oneOf/allOf/anyOf；OpenAI tool_calls assistant 消息 content 须发 null 而非空串；非测试代码禁止 unwrap()/expect()；新能力放 tools/ 或 providers/，严禁在 run_inner 加分支。"
    triage_notes: "查重时另查 .dev/runs/ 目录——本仓有自迭代工作流（self-improve flow）在途任务，正在跑的 goal 算 in-flight，不要重复开工。"
    doc_notes: "在 .dev/journal/manual-<YYYYMMDD>-<短标签>.md 补记录（Date/Goal/Files touched/Tests added/Notes），与自迭代 run 的观察史保持同构。"
    gates:
      - name: fmt
        command: cargo fmt --all --check
        timeout_secs: 300
      - name: clippy
        command: cargo clippy --workspace --all-targets --all-features -- -D warnings
        timeout_secs: 1800
      - name: test
        command: cargo test --workspace --no-fail-fast
        timeout_secs: 2400
      - name: tui-test-presence
        command: bash .dev/scripts/tui-test-presence.sh
        timeout_secs: 600
        paths: ["crates/recursive-tui/**"]
      - name: tui-mutants
        command: bash .dev/scripts/tui-mutants.sh
        timeout_secs: 3600           # AGENTS.md 失败模式 #8：main.rs 类改动要 40-60min，
        paths: ["crates/recursive-tui/**"]  # 20min 预算会产出截断的 survivor list 造成误判
  # TS pnpm 仓 + develop 基线 + PR 制（argusai 家族形态）
  jeffkit/argusai:
    base_branch: develop
    setup_command: pnpm install --frozen-lockfile
    test_command: pnpm type-check && pnpm test:run
    push_mode: pr                  # 该仓约定 PR 合并，不直推
    timeout_overrides:
      investigate: 900
      implement: 1800              # TS 仓不用 cargo 冷构建的 4200s
    review_notes: "禁止手改 schemas/*.json 而不同步 packages/core 的 schema 生成流程；改动 packages/core 编排/断言逻辑必须跑过相关包测试。"
    doc_notes: "版本发布走 Changesets：正确动作是 pnpm changeset 加 .changeset/*.md，不要直接改 CHANGELOG.md。"
  # 数据/分发/镜像仓：readonly（只调查不开工，investigate 后回评+路由建议）
  jeffkit/recursive-providers:
    mode: readonly
    triage_notes: "本仓是数据目录仓（providers.json 单一事实源）。数据修正请人工或走仓内脚本；功能问题应路由到 jeffkit/recursive。"
  jeffkit/argusai-marketplace:
    mode: readonly
    triage_notes: "本仓是插件分发仓。改行为请去 jeffkit/argusai 仓；本仓只接受插件定义/文档更新，需人工核对面板工具名与参数一致性。"

# ─── 安全过滤层（screener）────────────────────────────────────────────
# 在把内容投给主 agent 之前，先用一次纯 HTTP 的 LLM 调用检查是否含指令注入。
# 这一层在 keeper 进程内完成，不起子进程、无本地权限。
#
# provider: openai     —— OpenAI 兼容（DeepSeek / OpenAI / Moonshot 等）。默认。
# provider: anthropic  —— Anthropic messages API。
#
# backend: classic     —— 内置实现（支持 openai / anthropic 两种协议）。默认。
# backend: decision    —— 复用 plaita-nodes 的 DecisionNode：封闭决策空间
#                         {safe, unsafe} + 置信度门控；低于 min_confidence 只
#                         标记 low_confidence，交 keeper 转人工/重试（不写
#                         blocked、不发指控评论）。
# backend: flow        —— 判定配置来自 plaita-console 上一条已发布的 flow
#                         定义（supervisor 自迭代管线管着它的版本与质量）。
#                         按 refresh_secs TTL 拉取并落盘缓存，本地 DecisionNode
#                         执行——判定路径不依赖 console 在线；console 不可达时
#                         用 stale 缓存，连缓存都没有则回退下方本地凭据。
#                         定义里的 $ENV.X 从 daemon 进程环境展开。
#                         定义校验：choices 必须非空；on_low_confidence 只接受
#                         passthrough / default（需同时给 default_choice）/ error；
#                         question/api_base/api_key/model 里只允许 $ENV.X 与
#                         $INPUT[.字段] 占位符（其余 $xxx 判定义非法 → 服务故障重试）。
#
# flow 后端示例：
# console:
#   url: https://console.example.cc
#   api_key: ${PLAITA_CONSOLE_ADMIN_API_KEY}
#   flow_id: issue-screener
#   refresh_secs: 300
#   cache_path: ~/.issue-keeper/screener-flow.json   # 可省
#                         仅支持 provider: openai，需要安装 plaita-nodes。
#
# fail-safe：必须显式声明 screener.enabled。不写 screener 段 = 启动报错。
screener:
  enabled: true
  provider: openai
  api_key: ${DEEPSEEK_API_KEY}
  base_url: "https://api.deepseek.com/v1"
  model: deepseek-chat
  on_unsafe: skip        # skip（默认）/ comment
  max_chars: 8000
  # 可信作者（GitHub 登录名，大小写不敏感）：其提交的 issue 正文/评论**完全跳过**
  # screener**（不调判定模型、不发拦截评论）。默认空名单=一切照常。
  # 适用场景：核心贡献者批量提交时，判定层对同一内容反复产生「边缘误拦」——
  # 填名单即免除该层。填写前请自行评估信任面（该名单等于把这些人视为无注入风险）。
  # trusted_authors: [alice, bob]
  # backend: decision
  # min_confidence: 0.8  # 仅 decision 后端生效：低于此值只标记 low_confidence
  #                      # （keeper 转人工/重试，不写 blocked）

# ─── 项目绑定在哪里？──────────────────────────────────────────────────
# 项目绑定（repo/agent_label/cwd/profile/source/monitor_prs/env/github_token/intro）
# 不写在本文件，而是存在 internal.db 的 projects 表——这是 issue-keeper 的单一配置源。
# keeper 每轮 live-reload：db 里增删项目、改介绍/绑定即时生效，无需重启。
#
# 增删项目用 CLI：
#   python -m issue_keeper team add owner/repo --agent-label proj-a-agent \
#     --cwd ~/projects/proj-a --profile claude-code --source github_token \
#     --github-token '${GITHUB_TOKEN}' --env ANTHROPIC_API_KEY=${DEEPSEEK_API_KEY}
#   python -m issue_keeper team remove owner/repo
#   python -m issue_keeper team list
# 或一键 onboard（含自动生成自我介绍）：
#   python -m issue_keeper onboard ~/projects/newproj --agent-label newproj-agent --gen-intro
#
# 从旧版（repos 写在 yaml）升级时，一次性迁移：
#   python -m issue_keeper team import --config <旧 config.yaml>
# （旧 team.json 的 intro 也会一并迁进 db，team.json 改名为 .migrated 备份）

# 项目绑定 + issue 共用的 SQLite（projects 表与 issues 同库）
internal_db: ~/.issue-keeper/internal.db

# ─── 全局 agent env 模板 ──────────────────────────────────────────────
# 所有 agent 共用的 LLM 连接。密钥用 ${VAR} 引用，实际值在环境变量里
# （不入库、不进文件明文）。load_config 把这份模板套到 db 里每个项目绑定上；
# 某项目需要单独 env 时，在该项目 env 列覆盖（team add --env KEY=VALUE）。
agent_env:
  ANTHROPIC_API_KEY: ${DEEPSEEK_API_KEY}
  ANTHROPIC_BASE_URL: "https://api.deepseek.com/anthropic"
  CLAUDE_MODEL: "deepseek-chat"
  # DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}   # 用 deepseek CLI profile 时
  # DEEPSEEK_MODEL: deepseek-v4-pro

# ─── 防循环机制（三层保险）───────────────────────────────────────────
# 1. 评论/资源正文含 bot_marker（隐藏 HTML 注释）
# 2. 评论/资源正文含可见前缀 [issue-keeper:<agent_label>]
# 3. 评论/资源的 author == 当前 source 身份（self_identity）
# 任一命中即跳过。资源层（issue 本体）也识别 marker：
# AI 自己提的 issue 不触发首次回复，但评论层照常——别人/别的 agent 来评论仍触发。

# ─── 状态机（仅 internal source）─────────────────────────────────────
# issue 有 6 个状态：inbox / todo / doing / review / done / closed
# 流转规则（keeper 自动）：
#   人提的 issue 新建 → inbox
#   agent 提的 issue 新建 → todo
#   keeper 开始调 agent → doing
#   agent 回复完 → review
#   review 通过 → done
#   close → closed
#
# review 规则：
#   - agent 提的 issue → 该 agent 自己 review（下轮自动通过）
#   - 人提的 issue → 由 default_review_agent（或 repo 的 review_agent）先 review
#     需要人二次 review 时人接手
#
# CLI 改状态：python -m issue_keeper internal move <project> <number> --status <状态>
# CLI 看板：  python -m issue_keeper internal board <project>

